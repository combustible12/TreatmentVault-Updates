name: Publish HealthTrend 1.0.227 public update
on:
  push:
    branches: [healthtrend]
    paths: [release-export/release.json]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: healthtrend
          fetch-depth: 0
      - name: Reassemble and verify signed APK
        run: |
          set -euo pipefail
          cat release-export/part-* | base64 -d > HealthTrend-2026111303.apk
          echo "171b72819ef5dbebcd48b5cd7b5abbbef2e88bb29a068481d392bc762e4e9112  HealthTrend-2026111303.apk" | sha256sum -c -
          test "$(stat -c %s HealthTrend-2026111303.apk)" = "57378792"
      - name: Publish update channel without replacing old APKs
        run: |
          python3 - <<'PY'
          import json
          data={
            "name":"HealthTrend 1.0.227",
            "versionCode":2026111303,
            "sha256":"171b72819ef5dbebcd48b5cd7b5abbbef2e88bb29a068481d392bc762e4e9112",
            "url":"https://raw.githubusercontent.com/combustible12/TreatmentVault-Updates/healthtrend/HealthTrend-2026111303.apk",
            "notes":"完善图片导入的身份校验、单位换算、唯一名称显示与保存拦截；旧粘贴导入、词典和趋势链路保持隔离。"
          }
          open("update.json","w",encoding="utf-8").write(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
          rm -rf release-export .github/workflows/publish-healthtrend-227.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HealthTrend-2026111303.apk update.json
          git add -u
          git commit -m "Publish HealthTrend 1.0.227 public update"
          git push origin HEAD:healthtrend
      - name: Create permanent version page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create healthtrend-v2026111303 HealthTrend-2026111303.apk \
            --repo combustible12/TreatmentVault-Updates \
            --target healthtrend \
            --title "HealthTrend 1.0.227" \
            --notes "完善图片导入的身份校验、单位换算、唯一名称显示与保存拦截；旧粘贴导入、词典和趋势链路保持隔离。"

name: Publish TreatmentVault APK

on:
  push:
    paths:
      - publish.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read publish metadata
        id: meta
        shell: bash
        run: |
          echo "url=$(jq -r '.sourceUrl' publish.json)" >> "$GITHUB_OUTPUT"
          echo "versionCode=$(jq -r '.versionCode' publish.json)" >> "$GITHUB_OUTPUT"
          echo "versionName=$(jq -r '.versionName' publish.json)" >> "$GITHUB_OUTPUT"
          echo "notes=$(jq -r '.notes // ""' publish.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Download verified build artifact
        shell: bash
        run: |
          curl -L --fail --retry 3 --retry-delay 2 '${{ steps.meta.outputs.url }}' -o artifact.zip
          rm -rf unpacked
          mkdir -p unpacked
          unzip -o artifact.zip -d unpacked
          APK="$(find unpacked -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" TreatmentVault-latest.apk
      - name: Create update metadata
        shell: bash
        run: |
          SHA="$(sha256sum TreatmentVault-latest.apk | awk '{print $1}')"
          jq -n \
            --argjson versionCode '${{ steps.meta.outputs.versionCode }}' \
            --arg versionName '${{ steps.meta.outputs.versionName }}' \
            --arg apkUrl 'https://raw.githubusercontent.com/combustible12/TreatmentVault-Updates/main/TreatmentVault-latest.apk' \
            --arg sha256 "$SHA" \
            --arg notes '${{ steps.meta.outputs.notes }}' \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,notes:$notes}' > update.json
      - name: Publish latest APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TreatmentVault-latest.apk update.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish TreatmentVault ${{ steps.meta.outputs.versionName }}"
          git push
